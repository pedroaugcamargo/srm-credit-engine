# Serve o build do Vite e faz proxy de /api para o backend na mesma origem:
# o navegador nunca fala com outra origem, então não há CORS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        # Sem URI no proxy_pass: o caminho /api/v1/... chega intacto ao backend.
        # Idempotency-Key e X-Correlation-Id seguem como os demais headers.
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome: podem ficar em cache para sempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html sempre revalidado, para pegar o build novo.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
