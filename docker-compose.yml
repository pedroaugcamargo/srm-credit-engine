services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: credit_engine
      POSTGRES_USER: credit_engine
      POSTGRES_PASSWORD: credit_engine
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_engine -d credit_engine"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/credit_engine
      SPRING_DATASOURCE_USERNAME: credit_engine
      SPRING_DATASOURCE_PASSWORD: credit_engine
    depends_on:
      postgres:
        condition: service_healthy
