name: verify

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Show runner Docker
        run: docker version
      - name: Check formatting with Spotless
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B spotless:check
      - name: Verify with Testcontainers
        working-directory: backend
        run: ./mvnw -B verify
