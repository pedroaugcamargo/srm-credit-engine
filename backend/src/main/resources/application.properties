spring.application.name=credit-engine
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.prometheus.access=read-only
logging.structured.format.console=logstash
credit-engine.rounding.scale=2
credit-engine.rounding.mode=HALF_EVEN
credit-engine.fx.max-age=PT24H
credit-engine.fx.provider.delay=PT0S
credit-engine.fx.provider.failure=NONE
credit-engine.fx.provider.rate=5.4321
credit-engine.fx.provider.valid-from=2026-10-29T10:00:00-03:00
credit-engine.fx.provider.timeout=PT2S
credit-engine.fx.provider.max-retries=2
credit-engine.fx.provider.retry-initial-interval=PT0.2S
credit-engine.fx.provider.circuit-window-size=10
credit-engine.fx.provider.circuit-failure-rate=50
credit-engine.fx.provider.circuit-open-wait=PT30S
credit-engine.fx.provider.refresh-enabled=false
credit-engine.fx.provider.refresh-interval=PT1H
spring.datasource.url=jdbc:postgresql://localhost:5432/credit_engine
spring.datasource.username=credit_engine
spring.datasource.password=credit_engine
spring.jpa.hibernate.ddl-auto=validate
